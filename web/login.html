<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 航班查询系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    min-height: 100vh; color: #1c2b3a;
    background: linear-gradient(160deg, #e8f1fb 0%, #f5f8fc 55%, #e6f0fa 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 32px 16px;
  }
  .page { width: 100%; max-width: 410px; }
  .brand { text-align: center; margin-bottom: 22px; }
  .brand .logo {
    width: 56px; height: 56px; margin: 0 auto 14px;
    border-radius: 16px; background: linear-gradient(135deg, #1a6fc4, #2f97e0);
    color: #fff; font-size: 26px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(26, 111, 196, .28);
  }
  .brand h1 { font-size: 23px; color: #0b4a8f; letter-spacing: 2px; }
  .brand p { margin-top: 7px; font-size: 13px; color: #5a7a99; }

  .card {
    background: #fff; border-radius: 16px; padding: 26px 26px 22px;
    box-shadow: 0 8px 30px rgba(20, 70, 130, .12);
  }
  .tabs {
    display: flex; gap: 6px; background: #eef4fa; border-radius: 10px;
    padding: 4px; margin-bottom: 22px;
  }
  .tab {
    flex: 1; padding: 9px 0; border: none; background: transparent; cursor: pointer;
    font-size: 14.5px; color: #46688c; border-radius: 8px; font-family: inherit;
    transition: background .15s, color .15s;
  }
  .tab.active { background: #fff; color: #0b4a8f; font-weight: 600; box-shadow: 0 1px 4px rgba(20,70,130,.10); }

  .field { margin-bottom: 15px; }
  .field label { display: block; font-size: 13px; color: #46688c; font-weight: 600; margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 11px 13px; border: 1px solid #c8d9ea; border-radius: 9px;
    font-size: 14px; color: #1c2b3a; background: #fbfdff; outline: none;
    font-family: inherit; transition: border .15s, background .15s;
  }
  .field input:focus { border-color: #2f7fd1; background: #fff; }
  .field input::placeholder { color: #a9bdd0; }
  .pwd { position: relative; }
  .pwd input { padding-right: 58px; }
  .eye {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    border: none; background: transparent; color: #6f8fab; font-size: 12.5px;
    cursor: pointer; padding: 4px 8px; border-radius: 6px; font-family: inherit;
  }
  .eye:hover { background: #eef4fa; color: #1a6fc4; }

  .msg {
    font-size: 13px; border-radius: 8px; padding: 0 12px; margin-bottom: 14px;
    max-height: 0; overflow: hidden; opacity: 0; transition: all .18s;
  }
  .msg.show { max-height: 80px; opacity: 1; padding: 10px 12px; }
  .msg.error { background: #fdeceb; color: #b3342c; border: 1px solid #f5c6c2; }
  .msg.ok { background: #e7f7ee; color: #1a7a48; border: 1px solid #b6e7cd; }
  .msg.info { background: #eef4fa; color: #46688c; border: 1px solid #d3e3f2; }

  .submit {
    width: 100%; padding: 12px 0; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #1a6fc4, #2f97e0); color: #fff;
    font-size: 15.5px; font-weight: 600; letter-spacing: 2px; cursor: pointer;
    font-family: inherit; transition: filter .15s;
  }
  .submit:hover { filter: brightness(1.07); }
  .submit:disabled { opacity: .65; cursor: wait; letter-spacing: 1px; }

  .toast-line { text-align: center; margin-bottom: 14px; font-size: 12.5px; color: #46688c; }
  .toast-line a { color: #1a6fc4; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="page">
  <div class="brand">
    <div class="logo">✈</div>
    <h1>航班查询系统</h1>
    <p>登录后查询国内航班数据</p>
  </div>

  <div class="toast-line" id="resume" style="display:none"></div>

  <div class="card">
    <div class="tabs">
      <button class="tab" data-mode="register" type="button">注 册</button>
      <button class="tab active" data-mode="login" type="button">登 录</button>
    </div>

    <form id="form" autocomplete="off">
      <div class="field">
        <label>用户名</label>
        <input id="username" maxlength="20" placeholder="3-20 位字母、数字或下划线">
      </div>

      <div class="field">
        <label>密码</label>
        <div class="pwd">
          <input id="password" type="password" maxlength="64" placeholder="至少 6 位">
          <button class="eye" id="eye" type="button">显示</button>
        </div>
      </div>

      <div class="field" id="wrapConfirm" style="display:none">
        <label>确认密码</label>
        <input id="confirm" type="password" maxlength="64" placeholder="再输入一次">
      </div>

      <div class="msg" id="msg"></div>
      <button class="submit" id="submit" type="submit">登 录</button>
    </form>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var mode = "login";
  var servedByBackend = location.protocol === "http:" || location.protocol === "https:";

  function showMsg(text, type) {
    var box = $("msg");
    box.className = "msg show " + (type || "error");
    box.textContent = text;
  }
  function clearMsg() {
    $("msg").className = "msg";
    $("msg").textContent = "";
  }

  function switchMode(next) {
    mode = next;
    var isReg = next === "register";
    document.querySelectorAll(".tab").forEach(function (t) {
      t.classList.toggle("active", t.getAttribute("data-mode") === next);
    });
    $("wrapConfirm").style.display = isReg ? "block" : "none";
    $("submit").textContent = isReg ? "注 册 并 登 录" : "登 录";
    clearMsg();
  }

  document.querySelectorAll(".tab").forEach(function (tab) {
    tab.addEventListener("click", function () { switchMode(tab.getAttribute("data-mode")); });
  });

  $("eye").addEventListener("click", function () {
    var input = $("password");
    var toText = input.type === "password";
    input.type = toText ? "text" : "password";
    $("eye").textContent = toText ? "隐藏" : "显示";
  });

  function fail(res) {
    return res.json().then(function (j) {
      throw new Error(j && j.message ? j.message : "请求失败（HTTP " + res.status + "）");
    }, function () {
      throw new Error("请求失败（HTTP " + res.status + "）");
    });
  }

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    if (!servedByBackend) {
      showMsg("请通过 http://localhost:8080/login.html 打开本页，直接双击 html 文件无法连接后端。");
      return;
    }
    var username = $("username").value.trim();
    var password = $("password").value;

    if (!username) { showMsg("请输入用户名"); return; }
    if (!password) { showMsg("请输入密码"); return; }
    if (mode === "register") {
      if (username.length < 3) { showMsg("用户名至少 3 位"); return; }
      if (!/^[A-Za-z0-9_]+$/.test(username)) { showMsg("用户名只能包含字母、数字和下划线"); return; }
      if (password.length < 6) { showMsg("密码至少 6 位"); return; }
      if (password !== $("confirm").value) { showMsg("两次输入的密码不一致"); return; }
    }

    var url = mode === "login" ? "/api/auth/login" : "/api/auth/register";
    var payload = { username: username, password: password };

    clearMsg();
    var btn = $("submit");
    btn.disabled = true;
    btn.textContent = mode === "login" ? "登录中…" : "注册中…";

    fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).then(function (res) {
      if (!res.ok) return fail(res);
      return res.json();
    }).then(function (j) {
      sessionStorage.setItem("flight_token", j.token);
      sessionStorage.setItem("flight_user", JSON.stringify(j.user || {}));
      showMsg((j.message || "成功") + "，正在进入系统…", "ok");
      location.replace("index.html");
    }).catch(function (err) {
      showMsg(err.message || "网络异常，请确认后端已启动");
    }).then(function () {
      btn.disabled = false;
      btn.textContent = mode === "login" ? "登 录" : "注 册 并 登 录";
    });
  });

  (function checkResume() {
    var token = sessionStorage.getItem("flight_token");
    if (!token || !servedByBackend) return;
    fetch("/api/auth/me", { headers: { Authorization: "Bearer " + token }, cache: "no-store" })
      .then(function (res) {
        if (!res.ok) { sessionStorage.removeItem("flight_token"); sessionStorage.removeItem("flight_user"); return null; }
        return res.json();
      })
      .then(function (j) {
        if (!j) return;
        var u = j.user || {};
        var box = $("resume");
        box.style.display = "block";
        box.innerHTML = "已登录为 <b>" + (u.displayName || u.username) + "</b> · " +
          '<a href="index.html">直接进入系统</a>';
      })
      .catch(function () { /* 后端未启动时忽略 */ });
  })();

  if (!servedByBackend) {
    showMsg("当前是本地文件方式打开，无法调用后端接口。请先启动后端，再访问 http://localhost:8080/login.html", "info");
  }
})();
</script>
</body>
</html>
